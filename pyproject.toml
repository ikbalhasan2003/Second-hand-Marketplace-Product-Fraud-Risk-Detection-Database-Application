[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py313"
line-length = 110
exclude = [".tools", ".cache", ".database-tools", "docs/database/generate_reference.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
