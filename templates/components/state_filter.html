<form method="get" class="panel mb-3"><label for="record-status">Status</label><select name="status" id="record-status"><option value="">All states</option>{% for state in states %}<option value="{{ state }}" {% if request.GET.status == state %}selected{% endif %}>{{ state|title }}</option>{% endfor %}</select><button class="btn btn-outline-primary mt-2">Apply status filter</button>{% if request.GET.status %} <a href="?">Clear filter</a>{% endif %}</form>
