{% if page %}<nav class="mt-4 d-flex flex-wrap gap-3" aria-label="Record pages">{% if page.has_previous %}<a href="?{% if query %}{{ query }}&amp;{% endif %}page={{ page.previous_page_number }}" rel="prev">Previous</a>{% endif %}<span aria-current="page">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?{% if query %}{{ query }}&amp;{% endif %}page={{ page.next_page_number }}" rel="next">Next</a>{% endif %}</nav>{% endif %}
