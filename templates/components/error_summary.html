{% if form.errors %}<div class="alert alert-danger" role="alert" tabindex="-1" data-error-summary><h2>Review the form</h2>{{ form.non_field_errors }}<ul>{% for field in form %}{% if field.errors %}<li><a href="#{{ field.id_for_label }}">{{ field.label }}</a>: {{ field.errors|striptags }}</li>{% endif %}{% endfor %}</ul>{% if request.FILES %}<p>Select the files again before retrying.</p>{% endif %}</div>{% endif %}
