{% extends 'base.html' %}{% block content %}<div class="row g-4"><section class="col-md-7"><div class="panel"><h2>Change password</h2><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Change password</button></form></div></section><section class="col-md-5"><div class="panel"><h2>Marketplace access</h2><p>Changing apps does not add a membership.</p>{% if user.status == 'active' %}<form method="post" action="/account/enable/buyer/">{% csrf_token %}<button class="btn btn-outline-primary">Enable buyer access</button></form><form method="post" action="/account/enable/seller/">{% csrf_token %}<button class="btn btn-outline-primary mt-2">Enable seller access</button></form>{% endif %}</div></section></div>{% endblock %}
